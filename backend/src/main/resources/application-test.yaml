management:
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: error
    format.backend: warn

app:
  cors:
    allowed-origins: "*"

  s3:
    url: http://rustfs:9000
    region: eu-central-1
    access-key: rustfsadmin
    secret-key: rustfsadmin
    bucket: uploads
