spring:
  mongodb:
    uri: mongodb://root:password@mongodb:27017/format?authSource=admin&connectTimeoutMS=10000&socketTimeoutMS=30000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7001/realms/form-at
          jwk-set-uri: http://keycloak:7001/realms/form-at/protocol/openid-connect/certs
          audiences: ["spring-boot-backend"]

logging:
  level:
    data: debug
    org:
      springframework:
        security:
          oauth2: debug
        data:
          mongodb:
            core:
              MongoTemplate: debug
            repository:
              query: debug
      mongodb:
        driver:
          protocol:
            command: debug

springdoc:
  api-docs:
    path: /api/docs

  swagger-ui:
    path: /swagger-ui.html

cors:
  allowed-origins: "*"

minio:
  endpoint: http://minio:9000
  access-key: root
  secret-key: password
  bucket-name: uploads
