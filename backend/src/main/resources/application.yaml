spring:
  application:
    name: format-backend

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
        serialization-mode: via_dto

    mongodb:
      auto-index-creation: true

  modulith:
    events:
      staleness:
        published: 10m
        processing: 10m
        resubmitted: 10m
        check-interval: 1m

  profiles:
    default: dev

  mongodb:
    representation:
      uuid: standard

app:
  cors:
    allowed-headers: "*"
    allowed-methods: "*"
