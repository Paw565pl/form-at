services:
  mongodb:
    image: mongo:8-noble
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: format
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: mongosh --eval 'db.adminCommand("ping").ok' --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: format
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./keycloak/postgres/keycloack-schema-init.sql:/docker-entrypoint-initdb.d/keycloack-schema-init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready",
          "-U",
          "$$POSTGRES_USER",
          "-d",
          "$$POSTGRES_DB",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.7
    restart: on-failure
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: false
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: true
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile.prod
      args:
        KC_DB: postgres
    restart: on-failure
    ports:
      - "7000:7000"
    environment:
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 7000
      KC_DB_URL: jdbc:postgresql://postgres:5432/format
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      NEXT_JS_FRONTEND_SECRET: nextjsfrontendsecret

      KC_TELEMETRY_ENDPOINT: http://aspire-dashboard:18889
      KC_TELEMETRY_HEADER_X_OTLP_API_KEY: aspiredashboardotlpsecret
      KC_TRACING_ENABLED: true
      KC_TRACING_SAMPLER_RATIO: 1.0

      KC_FEATURE_OPENTELEMETRY_LOGS: enabled
      KC_TELEMETRY_LOGS_ENABLED: true
      KC_TELEMETRY_LOGS_LEVEL: warn
      KC_LOG_LEVEL: warn
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      OTLP_API_KEY: aspiredashboardotlpsecret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    restart: on-failure
    ports:
      - "18888:18888"
    environment:
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: aspiredashboardotlpsecret

volumes:
  mongodb-data:
  postgres-data:
  rustfs-data:
