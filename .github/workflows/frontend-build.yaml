name: Frontend build
run-name: ${{ github.actor }} is building frontend
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yaml"

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install node, pnpm and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          working-directory: ./frontend

      - name: Cache Next.js build output
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Check formatting with Prettier
        run: pnpm format:check

      - name: Check linting with ESLint
        run: pnpm lint

      - name: Check translations consistency
        run: pnpm dlx @lingual/i18n-check@latest --source en --locales messages

      - name: Build project
        run: pnpm build
