services:
  mongodb:
    image: mongo:8-noble
    restart: on-failure
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: format
    volumes:
      - mongodb-data:/data/db

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: on-failure
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio-data:/data

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile.dev
    restart: on-failure
    ports:
      - "7001:7001"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 7001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - minio
      - keycloak
    develop:
      watch:
        - action: rebuild
          path: ./backend/build.gradle.kts
        - action: sync+restart
          path: ./backend
          target: /app/
          ignore:
            - .gradle/
            - build/

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   restart: on-failure
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./frontend/.env.local
  #   depends_on:
  #     - backend
  #   develop:
  #     watch:
  #       - action: rebuild
  #         path: ./frontend/package.json
  #       - action: sync
  #         path: ./frontend
  #         target: /app/
  #         ignore:
  #           - node_modules/

volumes:
  mongodb-data:
  minio-data:
