services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.3
    hostname: mongodb
    restart: on-failure
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: password
      MONGODB_INITDB_DATABASE: format
      DO_NOT_TRACK: 1
      MONGOT_LOG_FILE: /dev/stdout
      RUNNER_LOG_FILE: /dev/stdout
    volumes:
      - mongodb-data:/data/db
      - mongot-data:/data/mongot
      - mongo-config:/data/configdb

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    restart: on-failure
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: true
    volumes:
      - rustfs-data:/data

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile.dev
    restart: on-failure
    ports:
      - "7000:7000"
    environment:
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 7000
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - rustfs
      - keycloak
    develop:
      watch:
        - action: rebuild
          path: ./backend/build.gradle.kts
        - action: sync+restart
          path: ./backend
          target: /app/
          ignore:
            - .gradle/
            - build/

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: sync
          path: ./frontend
          target: /app/
          ignore:
            - node_modules/

volumes:
  mongodb-data:
  mongot-data:
  mongo-config:
  rustfs-data:
